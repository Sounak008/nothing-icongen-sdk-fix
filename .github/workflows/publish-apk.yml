name: Build and publish APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute version from latest release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ github.ref_name }}"

          # Parse version code from latest release tag (build-1.0.0.N-...)
          # If no releases exist, start at 2
          VERSION_CODE=$(gh release list --limit 50 --json tagName --jq '.[].tagName' 2>/dev/null \
            | grep '^build-1\.0\.0\.' \
            | sed 's/^build-1\.0\.0\.//;s/-.*$//' \
            | sort -n \
            | tail -n 1 \
            || echo 1)

          VERSION_CODE=$((VERSION_CODE + 1))
          EPOCH=$(date +%s)
          VERSION_NAME="1.0.0.${VERSION_CODE}"
          TAG_NAME="build-${VERSION_NAME}-${VERSION_CODE}.${EPOCH}"

          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21 for Android SDK tools
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build release APK
        env:
          CI_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          CI_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew --no-daemon testDebugUnitTest :app:packageRelease

      - name: Sign and verify APK
        env:
          ICONGEN_KEYSTORE_BASE64: ${{ secrets.ICONGEN_KEYSTORE_BASE64 }}
          ICONGEN_KEYSTORE_PASSWORD: ${{ secrets.ICONGEN_KEYSTORE_PASSWORD }}
          ICONGEN_KEY_PASSWORD: ${{ secrets.ICONGEN_KEY_PASSWORD }}
          ICONGEN_KEY_ALIAS: ${{ vars.ICONGEN_KEY_ALIAS }}
        run: |
          umask 077
          keystore="$RUNNER_TEMP/icongen-release.keystore"
          trap 'rm -f "$keystore"' EXIT
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          if [ -n "$ICONGEN_KEYSTORE_BASE64" ] && [ -n "$ICONGEN_KEYSTORE_PASSWORD" ] && [ -n "$ICONGEN_KEY_ALIAS" ]; then
            echo "Signing with repository secrets keystore..."
            printf '%s' "$ICONGEN_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            "$signer" sign \
              --ks "$keystore" \
              --ks-key-alias "$ICONGEN_KEY_ALIAS" \
              --ks-pass env:ICONGEN_KEYSTORE_PASSWORD \
              --key-pass env:ICONGEN_KEY_PASSWORD \
              --out "$RUNNER_TEMP/IconGen.apk" \
              app/build/outputs/apk/release/app-release-unsigned.apk
          else
            echo "Signing secrets not configured. Generating standalone release keystore..."
            keytool -genkeypair -v \
              -keystore "$keystore" \
              -alias icongen \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=IconGen, OU=Android, O=IconGen, C=US"
            "$signer" sign \
              --ks "$keystore" \
              --ks-key-alias icongen \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$RUNNER_TEMP/IconGen.apk" \
              app/build/outputs/apk/release/app-release-unsigned.apk
          fi

          "$signer" verify --verbose --print-certs "$RUNNER_TEMP/IconGen.apk"

      - name: Upload commit APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: IconGen-${{ github.sha }}
          path: ${{ runner.temp }}/IconGen.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Publish commit prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ steps.version.outputs.tag_name }}"
          apk="$RUNNER_TEMP/IconGen.apk"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "${{ github.sha }}" \
              --title "IconGen v${{ steps.version.outputs.version_name }}" \
              --prerelease \
              --latest=false \
              --notes "Signed APK built on ${{ steps.version.outputs.tag_name }}. Source: [${{ github.sha }}](https://github.com/$GH_REPO/commit/${{ github.sha }}). See the [README](https://github.com/$GH_REPO/blob/${{ github.sha }}/README.md) for installation and setup."
          fi
